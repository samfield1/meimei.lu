<head>
  {% if include.title %}
    {% assign page_title = include.title %}
  {% else %}
    {% assign page_title = page.title %}
  {% endif %}
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />
  <meta name="description" content="{{ page.description | strip_html }}" />
  <meta name="author" content="Meimei Lu" />
  <meta name="reply-to" content="{{ site.email }}" />
  <link rel="me" href="mailto:{{ site.email }}">

  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta property="og:image" content="https://meimei.lu/assets/bg-img.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page_title | strip_html }}" />
  <meta property="og:description" content="{{ page.description | strip_html }}" />
  <meta property="og:site_name" content="meimei.lu" />
  <meta property="og:see_also" content="https://meimei.lu" />

  <meta name="twitter:card" content="https://meimei.lu/assets/bg-img.png" />
  <meta name="twitter:title" content="{{ page_title | strip_html }}" />
  <meta name="twitter:description" content="{{ page.description | strip_html }}" />
  <meta name="twitter:image" content="https://meimei.lu/assets/bg-img.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Meimei Lu",
    "url": "https://meimei.lu",
    "sameAs": [
      "https://www.behance.net/meimeilu1e80",
      "https://www.linkedin.com/in/meimei-lu-239bb5222/"
    ],
    "jobTitle": "UI/UX Designer",
    "description": "{{ page.description | strip_html }}"
  }
  </script>

  <link rel="author" href="https://www.linkedin.com/in/meimei-lu-239bb5222/" />
  <link rel="canonical" href="{{ site.url }}{{ page.url }}" />
  <title>{{ page_title | strip_html }}</title>
  <link rel="shortcut icon" href="/favicon.ico" />
  
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

  <link rel="stylesheet" href="/assets/style.css" />
</head>
